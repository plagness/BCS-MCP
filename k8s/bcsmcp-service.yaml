apiVersion: v1
kind: Service
metadata:
  name: bcsmcp
  namespace: ns-bcs
  labels:
    app: bcsmcp
spec:
  type: ClusterIP
  selector:
    app: bcsmcp
  ports:
  - port: 3333
    targetPort: 3333
    protocol: TCP
    name: mcp
---
# NodePort сервис для внешнего доступа к MCP (для тестирования)
apiVersion: v1
kind: Service
metadata:
  name: bcsmcp-nodeport
  namespace: ns-bcs
  labels:
    app: bcsmcp
spec:
  type: NodePort
  selector:
    app: bcsmcp
  ports:
  - port: 3333
    targetPort: 3333
    nodePort: 30332
    protocol: TCP
    name: mcp
